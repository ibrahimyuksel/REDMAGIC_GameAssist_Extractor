name: ROM Dosya Gezgini v2 - Seçmeli Dosya Çıkarma
on:
  workflow_dispatch:
    inputs:
      rom_baglantisi:
        description: 'ROM dosyasının doğrudan HTTPS indirme bağlantısı'
        required: true
        type: string
      aranacak_dosyalar:
        description: 'Çıkarılacak dosya adları (örnek: GameAssist*.apk,*.so)'
        required: false
        default: 'GameAssist*.apk'
        type: string
      islem_turu:
        description: 'ROM içindeki dosyaları listele veya seçtiklerini çıkar'
        required: true
        default: 'Dosyaları çıkar'
        type: choice
        options:
          - 'Dosyaları çıkar'
          - 'Yalnızca listele'
      zip_parca_sayisi:
        description: 'Normal arşiv için 1; .zip.00-.zip.03 gibi dört parça için 4'
        required: true
        default: '1'
        type: string
      taranacak_bolumler:
        description: 'system, system_ext, product, vendor, odm; all=tümü, none=yalnızca arşiv'
        required: true
        default: 'system'
        type: string
      rom_sha256:
        description: 'Varsa ROM dosyasının SHA-256 doğrulama değeri (isteğe bağlı)'
        required: false
        type: string
      azami_dosya_sayisi:
        description: 'Çıkarılabilecek en fazla dosya sayısı (1-30)'
        required: true
        default: '20'
        type: string
permissions:
  contents: read
jobs:
  explorer:
    name: ROM'u bulutta tara ve seçilen dosyaları çıkar
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Depodaki kodları hazırla
        uses: actions/checkout@v4
      - name: Bulut sunucusunu hazırla
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends brotli erofs-utils unzip e2fsprogs
          sudo apt-get clean
          df -h /
      - name: Testleri çalıştır
        run: |
          python3 tests/test_restore_sdat_stream.py
          python3 -m unittest discover -s tests -p 'test_rom_explorer_v2.py' -v
      - name: ROM'u GitHub'a indir ve dosyaları bul
        id: explore
        continue-on-error: true
        env:
          SOURCE_URL: ${{ inputs.rom_baglantisi }}
          FILE_PATTERN: ${{ inputs.aranacak_dosyalar }}
          MODE_TR: ${{ inputs.islem_turu }}
          PARTS: ${{ inputs.zip_parca_sayisi }}
          PARTITIONS: ${{ inputs.taranacak_bolumler }}
          CHECKSUM: ${{ inputs.rom_sha256 }}
          MAX_FILES: ${{ inputs.azami_dosya_sayisi }}
        run: |
          set -euo pipefail
          case "$MODE_TR" in
            'Dosyaları çıkar') MODE=extract ;;
            'Yalnızca listele') MODE=list ;;
            *) echo 'Geçersiz işlem türü' >&2; exit 1 ;;
          esac
          python3 scripts/rom_explorer_v2.py \
            --url "$SOURCE_URL" \
            --patterns "$FILE_PATTERN" \
            --mode "$MODE" \
            --parts "$PARTS" \
            --partitions "$PARTITIONS" \
            --sha256 "$CHECKSUM" \
            --max-files "$MAX_FILES" \
            --work "$RUNNER_TEMP/rom-explorer-work" \
            --out "$GITHUB_WORKSPACE/explorer-output"
      - name: Bulunan dosyaları ve raporu Artifacts'a yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Explorer-v2-Sonuclar
          path: explorer-output/
          if-no-files-found: warn
          compression-level: 5
          retention-days: 7
      - name: Çıkarma başarısızsa hatayı bildir
        if: steps.explore.outcome != 'success'
        run: exit 1
